AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Product API CloudFormation template

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage (dev, test, prod)

Resources:
  # S3 bucket for storing product data
  ProductsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'product-data-${Stage}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedOrigins:
              - '*'

  # Lambda execution role with S3 permissions
  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::product-data-${Stage}/*'
                  - !Sub 'arn:aws:s3:::product-data-${Stage}'

  # API Gateway for Product API
  ProductAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET, POST, PUT, DELETE, OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        AllowOrigin: "'*'"

  # Lambda Functions
  GetProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/getProducts.handler
      Runtime: nodejs16.x
      Role: !GetAtt ProductLambdaRole.Arn
      Environment:
        Variables:
          PRODUCTS_BUCKET: !Ref ProductsBucket
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref ProductAPI
            Path: /products
            Method: get

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/getProduct.handler
      Runtime: nodejs16.x
      Role: !GetAtt ProductLambdaRole.Arn
      Environment:
        Variables:
          PRODUCTS_BUCKET: !Ref ProductsBucket
      Events:
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductAPI
            Path: /products/{id}
            Method: get

  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/createProduct.handler
      Runtime: nodejs16.x
      Role: !GetAtt ProductLambdaRole.Arn
      Environment:
        Variables:
          PRODUCTS_BUCKET: !Ref ProductsBucket
      Events:
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductAPI
            Path: /products
            Method: post

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/updateProduct.handler
      Runtime: nodejs16.x
      Role: !GetAtt ProductLambdaRole.Arn
      Environment:
        Variables:
          PRODUCTS_BUCKET: !Ref ProductsBucket
      Events:
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductAPI
            Path: /products/{id}
            Method: put

  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/deleteProduct.handler
      Runtime: nodejs16.x
      Role: !GetAtt ProductLambdaRole.Arn
      Environment:
        Variables:
          PRODUCTS_BUCKET: !Ref ProductsBucket
      Events:
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductAPI
            Path: /products/{id}
            Method: delete

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ProductAPI}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  
  ProductsBucketName:
    Description: S3 Bucket for storing product data
    Value: !Ref ProductsBucket 